[project]
name = "brodilka"
version = "0.1.0"
description = "Next-department recommender on Instacart baskets + static store-walk demo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "catboost>=1.2.7",
    "pyyaml>=6",
    "kaggle>=1.6",
    "pillow>=10",
    "tqdm>=4.66",
    "requests>=2.32",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "matplotlib>=3.9", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brodilka"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
